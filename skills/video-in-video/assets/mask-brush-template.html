<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  :root { --bg:#12131a; --panel:#1c1e28; --line:#2c2f3d; --ink:#e8eaf2; --muted:#9aa0b5; --acc:#8B46C8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,Segoe UI,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 10px 0 0; font-weight:700; }
  .grp { display:flex; gap:7px; align-items:center; }
  button { background:#262a38; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:7px 11px; cursor:pointer; font:inherit; }
  button:hover { background:#31364a; }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700; }
  input[type=range] { width:120px; accent-color:var(--acc); }
  .val { min-width:44px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  #stage { flex:1; position:relative; overflow:hidden; background:#07080c; cursor:none; }
  #world { position:absolute; transform-origin:0 0; }
  #world video, #world canvas { position:absolute; left:0; top:0; display:block; }
  #paint { opacity:.55; }
  #cursor { position:fixed; border:2px solid #fff; border-radius:50%; pointer-events:none; mix-blend-mode:difference; display:none; z-index:9; }
  footer { padding:9px 14px; background:var(--panel); border-top:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #scrub { flex:1; min-width:200px; accent-color:var(--acc); }
  .hint { color:var(--muted); font-size:12.5px; }
  #out { position:fixed; inset:auto 14px 62px 14px; height:150px; background:#0c0d13; color:#b7f7c8; border:1px solid var(--line); border-radius:9px; padding:9px; font:12px/1.4 ui-monospace,Consolas,monospace; display:none; z-index:20; white-space:pre; overflow:auto; }
  .tag { background:#262a38; border:1px solid var(--line); border-radius:6px; padding:3px 8px; color:var(--muted); font-size:12px; }
</style>

<header>
  <h1>__TITLE__</h1>
  <div class="grp">
    <button id="mAdd" class="on">Pinceau</button>
    <button id="mDel">Gomme</button>
  </div>
  <div class="grp">
    <span class="hint">Taille</span>
    <input type="range" id="size" min="3" max="150" value="28">
    <span class="val" id="sizeV">28</span>
  </div>
  <div class="grp">
    <button id="undo">Annuler (Ctrl+Z)</button>
    <button id="clear">Tout effacer</button>
  </div>
  <div class="grp">
    <button id="vis" class="on">Masque visible</button>
    <button id="quadBtn" class="on">Contour dalle</button>
    <button id="fit">Ajuster</button>
  </div>
  <div class="grp">
    <button id="copy">Copier le JSON</button>
    <span class="tag" id="stat">0 trait</span>
  </div>
</header>

<div id="stage">
  <div id="world">
    <video id="vid" src="__VIDEOSRC__" muted playsinline></video>
    <canvas id="paint"></canvas>
    <canvas id="deco"></canvas>
  </div>
</div>
<div id="cursor"></div>

<footer>
  <button id="play">Lire</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span class="val" id="tV">0.00s</span>
  <span class="hint">molette = zoom · clic droit ou espace = déplacer · [ ] = taille · E = gomme</span>
</footer>
<pre id="out"></pre>

<script>
const W = __W__, H = __H__, QUAD = __QUAD__, KEY = "__KEY__";
const vid = document.getElementById('vid');
const paint = document.getElementById('paint'), deco = document.getElementById('deco');
const world = document.getElementById('world'), stage = document.getElementById('stage');
const pctx = paint.getContext('2d'), dctx = deco.getContext('2d');
for (const c of [paint, deco]) { c.width = W; c.height = H; }
vid.width = W; vid.height = H;

let view = {z:1, x:0, y:0};
let strokes = [], cur = null, mode = 'add', size = 28, painting = false, panning = false, panFrom = null;
let showMask = true, showQuad = true;

const store = {
  save(){ try { localStorage.setItem(KEY, JSON.stringify(strokes)); } catch(e){} },
  load(){ try { const v = localStorage.getItem(KEY); if (v) strokes = JSON.parse(v); } catch(e){} }
};
store.load();

function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
}
function fit(){
  const r = stage.getBoundingClientRect();
  view.z = Math.min(r.width / W, r.height / H) * 0.96;
  view.x = (r.width - W * view.z) / 2;
  view.y = (r.height - H * view.z) / 2;
  applyView();
}
function toImg(e){
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.x) / view.z, y: (e.clientY - r.top - view.y) / view.z };
}

function strokePath(ctx, s){
  ctx.lineWidth = s.r * 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const p = s.p;
  if (p.length === 1){ ctx.arc(p[0][0], p[0][1], s.r, 0, 6.2832); ctx.fill(); return; }
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  ctx.stroke();
}
function redraw(){
  pctx.clearRect(0, 0, W, H);
  for (const s of strokes){
    pctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    pctx.strokeStyle = '#ff2d55'; pctx.fillStyle = '#ff2d55';
    strokePath(pctx, s);
  }
  pctx.globalCompositeOperation = 'source-over';
  document.getElementById('stat').textContent = strokes.length + (strokes.length > 1 ? ' traits' : ' trait');
}
function drawDeco(){
  dctx.clearRect(0, 0, W, H);
  if (!showQuad) return;
  dctx.strokeStyle = '#25ff7a'; dctx.lineWidth = 3; dctx.setLineDash([14, 9]);
  dctx.beginPath();
  const k = ['tl','tr','br','bl'];
  dctx.moveTo(QUAD[k[0]][0], QUAD[k[0]][1]);
  for (let i = 1; i < 4; i++) dctx.lineTo(QUAD[k[i]][0], QUAD[k[i]][1]);
  dctx.closePath(); dctx.stroke(); dctx.setLineDash([]);
}

stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  if (e.button === 2 || e.button === 1 || e.shiftKey){
    panning = true; panFrom = {x:e.clientX - view.x, y:e.clientY - view.y};
    stage.setPointerCapture(e.pointerId); return;
  }
  if (e.button !== 0) return;
  const p = toImg(e);
  cur = { r: size, e: mode === 'del' ? 1 : 0, p: [[Math.round(p.x*10)/10, Math.round(p.y*10)/10]] };
  strokes.push(cur); painting = true;
  stage.setPointerCapture(e.pointerId);
  redraw();
});
stage.addEventListener('pointermove', e => {
  const c = document.getElementById('cursor');
  c.style.display = 'block';
  const d = size * 2 * view.z;
  c.style.width = d + 'px'; c.style.height = d + 'px';
  c.style.left = (e.clientX - d/2) + 'px'; c.style.top = (e.clientY - d/2) + 'px';
  if (panning){ view.x = e.clientX - panFrom.x; view.y = e.clientY - panFrom.y; applyView(); return; }
  if (!painting) return;
  const p = toImg(e), last = cur.p[cur.p.length - 1];
  if (Math.hypot(p.x - last[0], p.y - last[1]) < 1.5) return;
  cur.p.push([Math.round(p.x*10)/10, Math.round(p.y*10)/10]);
  redraw();
});
window.addEventListener('pointerup', () => {
  if (painting) store.save();
  painting = false; panning = false; cur = null;
});
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = e.deltaY < 0 ? 1.15 : 1/1.15;
  const nz = Math.max(0.05, Math.min(30, view.z * f));
  view.x = mx - (mx - view.x) * (nz / view.z);
  view.y = my - (my - view.y) * (nz / view.z);
  view.z = nz; applyView();
}, {passive:false});

document.addEventListener('keydown', e => {
  if (e.key === '[') { size = Math.max(3, size - 4); syncSize(); }
  else if (e.key === ']') { size = Math.min(150, size + 4); syncSize(); }
  else if (e.key.toLowerCase() === 'e') setMode(mode === 'del' ? 'add' : 'del');
  else if (e.key === ' ') { e.preventDefault(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { strokes.pop(); redraw(); store.save(); }
});
function syncSize(){ document.getElementById('size').value = size; document.getElementById('sizeV').textContent = size; }
function setMode(m){
  mode = m;
  document.getElementById('mAdd').classList.toggle('on', m === 'add');
  document.getElementById('mDel').classList.toggle('on', m === 'del');
}
document.getElementById('mAdd').onclick = () => setMode('add');
document.getElementById('mDel').onclick = () => setMode('del');
document.getElementById('size').oninput = e => { size = +e.target.value; document.getElementById('sizeV').textContent = size; };
document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); store.save(); };
document.getElementById('clear').onclick = () => { if (confirm('Effacer tout le masque ?')) { strokes = []; redraw(); store.save(); } };
document.getElementById('vis').onclick = e => { showMask = !showMask; paint.style.display = showMask ? 'block' : 'none'; e.target.classList.toggle('on', showMask); };
document.getElementById('quadBtn').onclick = e => { showQuad = !showQuad; drawDeco(); e.target.classList.toggle('on', showQuad); };
document.getElementById('fit').onclick = fit;

const scrub = document.getElementById('scrub'), tV = document.getElementById('tV');
document.getElementById('play').onclick = e => {
  if (vid.paused) { vid.play(); e.target.textContent = 'Pause'; }
  else { vid.pause(); e.target.textContent = 'Lire'; }
};
scrub.oninput = () => { if (vid.duration) { vid.pause(); document.getElementById('play').textContent = 'Lire'; vid.currentTime = vid.duration * scrub.value / 1000; } };
vid.addEventListener('timeupdate', () => {
  if (!vid.duration) return;
  tV.textContent = vid.currentTime.toFixed(2) + 's';
  if (!scrub.matches(':active')) scrub.value = Math.round(1000 * vid.currentTime / vid.duration);
});
vid.addEventListener('loadedmetadata', () => { fit(); drawDeco(); redraw(); });

document.getElementById('copy').onclick = async () => {
  const json = JSON.stringify({ w: W, h: H, strokes: strokes });
  const out = document.getElementById('out');
  out.style.display = 'block'; out.textContent = json;
  try { await navigator.clipboard.writeText(json); document.getElementById('copy').textContent = 'Copié !'; }
  catch(e){ const r = document.createRange(); r.selectNodeContents(out); getSelection().removeAllRanges(); getSelection().addRange(r); }
  setTimeout(() => document.getElementById('copy').textContent = 'Copier le JSON', 1800);
};
window.addEventListener('resize', fit);
fit(); drawDeco(); redraw();
</script>
